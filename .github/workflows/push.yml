name: push

on: 
  push:
    branches: ["main"]

jobs:
  pylint:
    name: Lint Code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pylint
    - name: Run Pylint (excluding test_app.py)
      run: |
        pylint --fail-under=8.0 $(git ls-files '*.py' | grep -v 'test_app.py')

  test:
    name: Run test_app.py
    runs-on: ubuntu-latest
    needs: pylint
    strategy:
      matrix:
        python-version: ["3.9"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    - name: Create .env from secret
      run: |
        echo "${{ secrets.ENV_FILE }}" > backend/.env
    - name: Set up test environment
      run: |
        export CI=True
        export FLASK_TESTING=True
        export SQLALCHEMY_DATABASE_URI='sqlite:///:memory:'
    - name: Run test_app.py
      run: |
        cd backend && python -m unittest test_app.py -v