name: push

on: 
  push:
    branches: ["main"]

jobs:
  pylint:
    name: Lint Code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
    - name: Run Pylint (excluding test_app.py)
      run: |
        pylint --fail-under=8.0 $(git ls-files '*.py' | grep -v 'test_app.py')

  test:
    name: Run test_app.py
    runs-on: ubuntu-latest
    needs: pylint
    strategy:
      matrix:
        python-version: ["3.9"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # pip install -r requirements.txt  # если нужно
    - name: Run test_app.py
      run: |
        python test_app.py